apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "common.names.fullname" . }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - netbox.dev
    resources:
      - asnclaims
      - asns
      - ipaddressclaims
      - ipaddresses
      - iprangeclaims
      - ipranges
      - l2vpnclaims
      - l2vpns
      - prefixclaims
      - prefixes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - netbox.dev
    resources:
      - asnclaims/finalizers
      - asns/finalizers
      - ipaddressclaims/finalizers
      - ipaddresses/finalizers
      - iprangeclaims/finalizers
      - ipranges/finalizers
      - l2vpnclaims/finalizers
      - l2vpns/finalizers
      - prefixclaims/finalizers
      - prefixes/finalizers
    verbs:
      - update
  - apiGroups:
      - netbox.dev
    resources:
      - asnclaims/status
      - asns/status
      - ipaddressclaims/status
      - ipaddresses/status
      - iprangeclaims/status
      - ipranges/status
      - l2vpnclaims/status
      - l2vpns/status
      - prefixclaims/status
      - prefixes/status
    verbs:
      - get
      - patch
      - update
