  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: l2vpnclaims.netbox.dev
spec:
  group: netbox.dev
  names:
    kind: L2VPNClaim
    listKind: L2VPNClaimList
    plural: l2vpnclaims
    shortNames:
